[workspace]
resolver = "3"
members = ["core", "server", "app"]
# `app/` (Tauri shell) is a member but not a default member: workers only
# build core/server; `-p photosee-app` or --workspace builds the shell.
default-members = ["core", "server"]
# Spikes and tools are standalone crates with their own lockfiles.
exclude = ["spikes", "tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

# Every dependency is pinned exactly and justified in docs/deps.md.
# Workers must not edit this table; request additions in the package report.
[workspace.dependencies]
photosee-core = { path = "core" }

# core
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
fast_image_resize = { version = "=6.1.0", features = ["image"] }
jxl-oxide = "=0.12.6"
zune-psd = "=0.5.1"
zune-core = "=0.5.3"
moxcms = "=0.9.1"
kamadak-exif = "=0.6.1"
resvg = { version = "=0.49.0", default-features = false, features = ["raster-images"] }
alphanumeric-sort = "=1.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_Foundation"] }

# server
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
http-body-util = "=0.1.5"
futures-util = "=0.3.34"
mime_guess = "=2.0.5"

# dev / test only
tempfile = "=3.27.0"
rawler = "=0.8.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"
dbg_macro = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoding in debug builds is 10-50x slower and makes tests on real photos crawl.
[profile.dev.package."*"]
opt-level = 2
