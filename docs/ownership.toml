# Which paths each work package may change. `scripts/gates.mjs --ownership
# <WP> <base>` fails if a branch touches anything else. Globs: `*` matches
# within one path segment, `**` matches any depth. Contract files (see
# [contract]) belong to the orchestrator only.

[contract]
paths = [
  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "clippy.toml",
  "web/package.json", "web/package-lock.json", "web/tsconfig.json",
  "web/eslint.config.js", "web/vite.config.ts", "web/index.html",
  "core/Cargo.toml", "server/Cargo.toml",
  "core/src/lib.rs", "core/src/types.rs", "core/src/error.rs", "core/src/io.rs",
  "core/src/testfs.rs", "core/src/config.rs", "core/src/decode/mod.rs", "core/src/decode/heic.rs",
  "server/src/lib.rs", "server/src/state.rs",
  "web/src/api.ts", "web/src/state.ts", "web/src/constants.ts", "web/src/ctx.ts",
  "web/src/actions.ts", "web/src/style.css",
  "contracts/**", "docs/**", "scripts/check.ps1", "scripts/gates.mjs", "AGENTS.md", "TASKS.md",
]

# ---- M0 ----
[M0-T]
paths = ["spikes/transport/**"]

[M0-R]
paths = ["core/src/decode/raw/**", "core/tests/raw_*.rs"]

[M0-S]
paths = ["tools/bench-smb/**", "scripts/bench-smb.ps1"]

[M0-F]
paths = ["tools/gen-fixtures/**", "fixtures/generated/.gitkeep"]

# ---- M1 Wave 1 ----
[A]
paths = ["core/src/scan.rs", "core/src/sort.rs", "core/src/nav.rs", "core/tests/nav_*.rs"]

[B]
paths = ["web/src/slideshow.ts", "web/test/slideshow.test.ts"]

[C]
