  "core/src/format.rs", "core/src/orient.rs", "core/src/color.rs", "core/src/resize.rs",
  "core/src/encode.rs", "core/src/delivery.rs", "core/src/pipeline.rs",
  "core/src/decode/std_formats.rs", "core/tests/pipeline_*.rs",
]

[D]
